name: NetShield-eBPF Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Linux Kernel Development Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev libbpf-dev libpcap-dev gcc make

      - name: Run Go Generate
        run: go generate ./...

      - name: Run Go Tests
        run: go test -v -race ./...

      - name: Build Go Agent Binaries
        run: |
          go build -o netshield ./cmd/netshield
          go build -o netshield-cli ./cmd/netshield-cli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Run ESLint checks
        working-directory: web
        run: npm run lint

      - name: Build React Production Package
        working-directory: web
        run: npm run build

      - name: Audit Frontend Dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  docker-release:
    runs-on: ubuntu-24.04
    needs: verify-release
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Note: Requires DOCKER_USERNAME and DOCKER_PASSWORD secrets configured in the repository
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Go Agent Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            yasarkaan/netshield-agent:${{ github.ref_name }}
            yasarkaan/netshield-agent:latest

      - name: Scan Go Agent Image
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: yasarkaan/netshield-agent:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Build & Push React Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            yasarkaan/netshield-web:${{ github.ref_name }}
            yasarkaan/netshield-web:latest

      - name: Scan React Web Image
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: yasarkaan/netshield-web:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: '1'

  helm-release:
    runs-on: ubuntu-24.04
    needs: verify-release
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Package Helm Chart
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          helm package helm/netshield --version "$VERSION" --app-version "${{ github.ref_name }}"

      - name: Create GitHub Release and Upload Helm Chart
        uses: softprops/action-gh-release@v2
        with:
          files: netshield-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
